name: VigiaSaude Bot

on:
  workflow_dispatch:
- schedule:
    # Roda a cada 5 horas para garantir que o bot se mantenha ativo e reinicie se necessário
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Adicione aqui embaixo outras variáveis do seu .env caso seu bot utilize:
          # OUTRA_VARIAVEL: ${{ secrets.OUTRA_VARIAVEL }}
        run: |
          python main.py