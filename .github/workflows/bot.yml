name: VigiaSaude Premium

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar e Rodar Bot em Venv
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          NOME_ADMIN: ${{ secrets.NOME_ADMIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PORT: ${{ secrets.PORT }}
        run: |
          # 1. Cria um ambiente virtual limpo no GitHub
          python -m venv venv
          
          # 2. Ativa o ambiente virtual
          source venv/bin/activate
          
          # 3. Instala tudo o que o bot precisa dentro desse ambiente
          pip install --upgrade pip
          pip install mercadopago python-telegram-bot supabase httpx beautifulsoup4 google-generativeai groq python-dotenv
          
          # 4. Testa se instalou mesmo
          python -c "import mercadopago; print('✅ MercadoPago instalado!')"
          
          # 5. Roda o bot
          python main.py